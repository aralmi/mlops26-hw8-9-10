name: Fast release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # План удалённого CI; фактические прогоны этой сдачи выполнены локально.
      # Модель и Docker для быстрых проверок не требуются.
      - run: python -m pip install uv==0.13.7
      - run: uv sync --frozen
      - run: make check
      - run: make break-demo
